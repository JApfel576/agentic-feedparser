name: Generate Project Tree

on:
  push:
    branches:
      - main
  workflow_dispatch:  # lets you trigger it manually from the Actions tab

jobs:
  tree:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit the file back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install tree
        run: sudo apt-get update && sudo apt-get install -y tree

      - name: Update README with tree
        run: |
          TREE=$(tree -I 'node_modules|.git|__pycache__|.venv')
          awk -v tree="$TREE" '
            /<!-- TREE_START -->/ { print; print "```"; print tree; print "```"; skip=1; next }
            /<!-- TREE_END -->/ { skip=0 }
            !skip { print }
          ' README.md > README.tmp && mv README.tmp README.md

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "docs: update project structure tree"
          git push