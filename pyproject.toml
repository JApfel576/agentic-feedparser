[tool.fastapi]
entrypoint = "services.fastapi_app.src.fastapi_app.main:app"

[tool.uv.workspace]
members = [
    "packages/feedpoller",
    "services/fastapi_app",
    "packages/feed_agents",
    "packages/base_agents",
]

[tool.uv.sources]
feedpoller = { workspace = true }
base-agents = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.15.13",
]

[tool.ruff.lint]
extend-select = ["FAST001", "FAST002", "FAST003", "UP"]
